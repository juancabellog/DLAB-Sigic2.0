<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <div class="dialog-form">
    <div *ngIf="showPersonSearch" class="field-block">
      <label class="field-label">Researcher / Person *</label>
      <app-researcher-search
        [selectedResearcher]="selectedResearcher"
        [clearOnSelect]="false"
        (researcherSelected)="onResearcherSelected($event)">
      </app-researcher-search>
    </div>

    <div *ngIf="isEditMode && selectedResearcher" class="person-preview">
      <app-person-avatar
        [name]="selectedResearcher.fullname || ''"
        [iniciales]="selectedResearcher.iniciales || ''"
        [imageUrl]="resolvedProfileImageUrl"
        size="lg">
      </app-person-avatar>
      <div class="person-preview__info">
        <div class="person-preview__name">{{ selectedResearcher.fullname }}</div>
        <a *ngIf="personProfileLink" [routerLink]="personProfileLink" class="profile-link" (click)="cancel()">
          Edit person profile
        </a>
      </div>
    </div>

    <div *ngIf="showProfileImageUpload" class="profile-image-block">
      <label class="field-label">Profile image / photo</label>
      <app-person-profile-avatar-upload
        [name]="selectedResearcher?.fullname || ''"
        [iniciales]="selectedResearcher?.iniciales || ''"
        [profileImageUrl]="profileImageUrl"
        [disabled]="!personId">
      </app-person-profile-avatar-upload>
    </div>

    <mat-form-field *ngIf="showResourceType" appearance="outline" class="full-width">
      <mat-label>Resource type *</mat-label>
      <mat-select [(ngModel)]="resourceType" required>
        <mat-option *ngFor="let tipo of researcherTypes" [value]="tipo.id!.toString()">
          {{ tipo.descripcion || tipo.idDescripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>ORCID</mat-label>
      <input matInput [(ngModel)]="orcid" placeholder="0000-0000-0000-0000" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Mobile phone</mat-label>
      <input matInput [(ngModel)]="mobilePhone" />
    </mat-form-field>

    <p class="field-hint contact-hint">{{ contactHelperText }}</p>

    <mat-form-field *ngIf="showDates" appearance="outline" class="full-width">
      <mat-label>Start date *</mat-label>
      <input matInput type="date" [(ngModel)]="startDate" required />
    </mat-form-field>

    <mat-form-field *ngIf="showDates && (isEditMode || endDate)" appearance="outline" class="full-width">
      <mat-label>End date</mat-label>
      <input matInput type="date" [(ngModel)]="endDate" />
      <mat-hint>Leave empty for current assignment</mat-hint>
    </mat-form-field>

    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="saving">Cancel</button>
  <button mat-raised-button color="primary" type="button" (click)="save()" [disabled]="saving">
    <span *ngIf="!saving">Save</span>
    <mat-spinner *ngIf="saving" diameter="20"></mat-spinner>
  </button>
</mat-dialog-actions>
